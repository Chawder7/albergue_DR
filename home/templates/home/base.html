<!--Header-->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title>{% block titulo %}{% endblock titulo %}</title>
        {% load static %}
        <!-- Favicon-->
        <link rel="icon" type="image/jpg" href="{% static 'home/Images/favicon.jpg' %}">
        <!-- Bootstrap icons-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet" />
        <!-- Core theme CSS (includes Bootstrap)-->
        <link href="{% static 'home/css/styles.css' %}" rel="stylesheet" />
    </head>
    <body class="d-flex flex-column min-vh-100">
        <!-- Responsive navbar-->
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-1">
            <div class="container px-lg-5">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link text-white" href="{% url "Medicamentos" %}">LOGIN</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        <!--Fin Responsive navbar-->
    
        <!-- Contenido Principal -->
        <div class="flex-grow-1">
            <!--Contenido-->
            {% block contenido %}
            {% endblock contenido %}
            <!--Fin Contenido-->
        </div>
        <!-- Fin Contenido Principal -->
    
        <!--Footer-->
        <footer class="py-2">
            <div class="container"><p class="m-0 text-center">Copyright &copy; Albergue Divino Redentor 2024</p></div>
        </footer>
        <!-- Bootstrap core JS-->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
        <!-- Core theme JS-->
        <script src="js/scripts.js"></script>
    </body>
</html>
<!--Fin Footer-->
