{% extends "home/base.html" %}
{% block titulo %}Editar Paciente{% endblock  %}

{% block contenido %}
<section class="sectionForm">
    <div class="form-container">
        <h2>Editar Paciente</h2>
        <form action="{%url 'Actualizar' paciente.id %}" method="POST" role="form" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="container1">
                <div class="form-group">
                    <label>Nombre</label>
                    <input value="{{paciente.nombrePaciente}}" type="text" name="nombrePaciente" required placeholder = "Nombre">
                </div>
                <div class="form-group">
                    <label>Apellidos</label>
                    <input value="{{paciente.apellidoPaciente}}" type="text" name="apellidoPaciente" required placeholder = "Apellidos">
                </div>
                <div class="form-group">
                    <label>Edad</label>
                    <input value="{{paciente.edad}}" type="number" name="edad" min="1" step="1" required placeholder = "Edad">
                </div>
                <div class="form-group">
                    <label>Género</label>
                    <select name="genero">
                        <option value="1" {%if paciente.genero == 1%} selected {%endif%} >Masculino</option>
                        <option value="2" {%if paciente.genero == 2%} selected {%endif%}>Femenino</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>Imagen</label>
                <input type="file" name="fotoPaciente" />
                <div class="form-group center">
                <h6>Imagen Actual</h6>
                <img src="{{ paciente.fotoPaciente.url }}" alt="Imagen actual" style="max-width: 100px; max-height: 100px;"> 
                </div>
            </div>
            <div class="form-button">
                <input type="submit" class="btn btn-primary" value = "Aceptar">
                <a href = "{%url 'Pacientes'%}" class="btn btn-secondary"> Cancelar</a>
            </div>
        </form>
    </div>
</section>
{% endblock  %}
